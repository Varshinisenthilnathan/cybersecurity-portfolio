<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Maid</title>
    <link rel="stylesheet" href="css/create_maid.css">
</head>
<body>
    <div class="back">
         <a href="dashboard_admin.html">Back</a>
         </div>
    <div class="container">
        <h2>Create New Maid</h2>
        <form id="createMaidForm">
            <div class="form-group">
                <label for="name">Name*</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="phone_number">Phone Number*</label>
                <input type="text" id="phone_number" name="phone_number" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address"></textarea>
            </div>

            <div class="form-group">
                <label for="gender">Gender*</label>
                <select id="gender" name="gender" required>
                    <option value="">Select</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob">
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" min="0">
            </div>

            <div class="form-group">
                <label for="experience_years">Experience (Years)</label>
                <input type="number" id="experience_years" name="experience_years" min="0">
            </div>

            <div class="form-group">
                <label for="service">Service*</label>
                <input type="text" id="service" name="service" required>
            </div>

            <div class="form-group">
                <label for="salary">Salary</label>
                <input type="number" id="salary" name="salary" min="0" step="0.01">
            </div>

            <button type="submit" class="btn">Save</button>
        </form>
        <div class="back">
         <a href="maid.html">Back</a>
         </div>
        <p id="message"></p>
    </div>

    <script src="js/create_maid.js"></script>
</body>
</html>
