<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <div class="form-container">
        <h2>Customer Registration</h2>
        <lable>Full Name</lable>
        <input type="text" id="name" placeholder="Full Name" required>
        <lable>Phone Number</lable>
        <input type="tel" id="phone_number" pattern="[0-9]{10}" maxlength="8" placeholder="Phone Number" required oninput="this.value = this.value.replace(/[^0-9]/g, '');">
        <lable>Address</lable>
        <input type="text" id="address" placeholder="Address">
        <lable>Email</lable>
        <input type="email" id="email" placeholder="Email" required>
        <lable>Gender</lable>
        <select id="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>
        <label>Age</label>
        <input type="number" id="age" placeholder="Age" min="1" max="120">
        <label>date of birth</label>
        <input type="date" id="dob" placeholder="Date of Birth">
        <label>Username</label>
        <input type="text" id="username" placeholder="Username" required>
        <lable>Password</lable>
        <input type="password" id="password" placeholder="Password" required>
        <lable>service</lable>
        <input type="text" id="service_registered" placeholder="Service Registered" required>
        <button id="registerBtn">Register</button>
        <p id="message"></p>
    </div>

    <script src="js/register.js"></script>
</body>
</html>
