<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Booking</title>
    <link rel="stylesheet" href="css/update_bookings.css">
    
    <script src="js/update_bookings.js"></script>
</head>
<body>
    <div class="update-container">
        <h1>Update Booking</h1>
        <form id="updateBookingForm" class="update-form">
            <h2>Update Booking</h2>
            <p id="message"></p>

            <label>Booking ID</label>
            <input type="text" id="booking_id" readonly>

            <label>Customer Name</label>
            <input type="text" id="customer_name" readonly>

            <label>Maid Name</label>
            <input type="text" id="maid_name" readonly>

            <label>Service</label>
            <input type="text" id="service" required>

            <label>Duration (hours)</label>
            <input type="number" id="duration" required>

            <label>Payment(in $)</label>
            <input type="tel" id="payment" pattern="[0-9]{10}" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '');" required>

            <label>Status</label>
            <select id="status">
                <option value="PENDING">Pending</option>
                <option value="CONFIRMED">Confirmed</option>
                <option value="CANCELLED">Cancelled</option>
                <option value="COMPLETED">Completed</option>
            </select>

            <button type="submit">Save Changes</button>
        </form>
        <div id="popup" class="popup">Booking Updated Successfully!</div>
    </div>
</body>
</html>
