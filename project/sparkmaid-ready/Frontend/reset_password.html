<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SparkMaid</title>
    <link rel="stylesheet" href="css/reset_password.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <div class="reset-container">
        <h2>Reset Password</h2>
        <p class="reset-subtitle">Enter your new password below</p>

        <!-- OTP field (only for customers) -->
        <div id="otpContainer" class="form-group" style="display:none;">
            <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6" pattern="\d{6}">
        </div>

        <div class="form-group password-field">
            <input type="password" id="new_password" placeholder="Enter new password" required><br>
            <br><span id="togglePassword" class="toggle-icon">👁️</span>
        </div>

        <button id="resetBtn">Reset Password</button>

        <p id="message"></p>

        <div class="back-link">
            <p><a href="index.html">← Back to Login</a></p>
        </div>
    </div>

    <script src="js/reset_password.js"></script>
</body>
</html>
