<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SparkMaid</title>
    <link rel="stylesheet" href="css/forget_password.css">
</head>
<body>
    <div class="forgot-container">
        <h2>Forgot Password?</h2>
        <p class="forgot-subtitle">Enter your email to reset your password</p>

        <input type="email" id="email" placeholder="Enter your registered email" required>
        <button id="submitBtn">Submit</button>

        <p id="message"></p>

        <div class="back-link">
            <p><a href="index.html">← Back to Login</a></p>
        </div>
    </div>

    <script src="js/forget_password.js"></script>
</body>
</html>
