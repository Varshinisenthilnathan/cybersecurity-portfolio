<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Details - Coming Soon</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .coming-soon {
            font-size: 18px;
            color: #ff4500;
            font-weight: bold;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            cursor: not-allowed; /* Disabled cursor since it's coming soon */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Payment Details</h1>
        <p class="coming-soon">This pre paid feature is coming soon!</p>

        <!-- Static form for display only -->
        <form>
            <input type="text" placeholder="Cardholder Name" disabled>
            <input type="text" placeholder="Card Number" disabled>
            <input type="text" placeholder="Expiry Date (MM/YY)" disabled>
            <input type="text" placeholder="CVV" disabled>
            <button type="submit" disabled>Submit Payment</button>
        </form>
        <div class="back">
         <a href="dashboard_admin.html">Back</a>
         </div>
    </div>
    
    <script src="js/transaction.js"></script>
</body>
</html>
