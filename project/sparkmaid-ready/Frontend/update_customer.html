<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Customer</title>
    <link rel="stylesheet" href="css/update_customer.css">
</head>
<body>
    <h2>Update Customer</h2>
    <div id="message"></div>
    <form id="updateCustomerForm">
        <label>Name:</label>
        <input type="text" name="name" id="name" required>
        <label>Username:</label>
        <input type="text" name="username" id="username" required>
        <label>Email:</label>
        <input type="email" name="email" id="email">
        <label>Phone:</label>
        <input type="text" name="phone_number" id="phone_number" required>
        <label>Gender:</label>
        <select name="gender" id="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>
        <label>Address:</label>
        <input type="text" name="address" id="address">
        <label>Date of Birth:</label>
        <input type="date" name="dob" id="dob">
        <label>Service Registered:</label>
        <input type="text" name="service_registered" id="service_registered">
        <button type="submit">Update Customer</button>
        <div class="back">
         <a href="dashboard_admin.html">Back</a>
         </div>
    </form>
    
    

    <script src="js/update_customer.js"></script>
</body>
</html>
