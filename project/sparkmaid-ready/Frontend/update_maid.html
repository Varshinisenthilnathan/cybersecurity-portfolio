<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Maid</title>
    <link rel="stylesheet" href="css/update_maid.css">
</head>
<body>
    <div class="container">
        <h1>Update Maid Details</h1>
        <form id="updateMaidForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="phone_number">Phone Number</label>
                <input type="text" id="phone_number" name="phone_number">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob">
            </div>
            <div class="form-group">
                <label for="service">Service</label>
                <input type="text" id="service" name="service" required>
            </div>
            <div class="form-group">
                <label for="experience_years">Experience (Years)</label>
                <input type="number" id="experience_years" name="experience_years" min="0">
            </div>
            <div class="form-group">
                <label for="salary">Salary</label>
                <input type="number" id="salary" name="salary" min="0" step="0.01">
            </div>
            <div class="form-group">
                <label for="availability_status">Availability Status</label>
                <select id="availability_status" name="availability_status">
                    <option value="AVAILABLE">Available</option>
                    <option value="BOOKED">Booked</option>
                    <option value="INACTIVE">Inactive</option>
                </select>
            </div>
            <button type="submit" class="save-btn">Save</button>
        </form>
        <p id="message"></p>
    </div>
    <script src="js/update_maid.js"></script>
</body>
</html>
